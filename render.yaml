services:
  - type: web
    name: datapulse-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: CORS_ORIGINS
        value: "https://data-pulse-kappa.vercel.app,http://localhost:5173"
      - key: ALLOW_SQLITE_FALLBACK
        value: "true"
